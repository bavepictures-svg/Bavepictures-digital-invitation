<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="seo.title"></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600&family=Herr+Von+Muellerhoff&family=Outfit:wght@300;400;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="envelope.css">
</head>
<body class="env-lock">
<!-- ENVELOPE INTRO (envelope.css / envelope.js) -->
<div id="envelope" class="env" role="dialog" aria-label="" data-i18n-aria="envelope.ariaOpen">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="eb-branch" viewBox="0 0 420 150"><path d="M4 78 C 110 70, 250 82, 410 66" fill="none" stroke="#f4f2e8" stroke-width="3.2" stroke-linecap="round"/><g transform="translate(40.0 79.1) rotate(-33.9)"><path d="M0 0 C 18.5 -18.0, 51.8 -15.3, 74.0 0 C 51.8 15.3, 18.5 18.0, 0 0Z" fill="#f4f2e8" stroke="rgba(150,146,118,.35)" stroke-width=".8"/><path d="M2 0 L 66.6 0" fill="none" stroke="rgba(150,146,118,.4)" stroke-width=".8" stroke-linecap="round"/></g><g transform="translate(70.0 79.9) rotate(31.8)"><path d="M0 0 C 17.5 -17.1, 49.1 -14.5, 70.125 0 C 49.1 14.5, 17.5 17.1, 0 0Z" fill="#f4f2e8" stroke="rgba(150,146,118,.35)" stroke-width=".8"/><path d="M2 0 L 63.1 0" fill="none" stroke="rgba(150,146,118,.4)" stroke-width=".8" stroke-linecap="round"/></g><g transform="translate(100.0 80.5) rotate(-37.8)"><path d="M0 0 C 16.6 -16.1, 46.4 -13.7, 66.25 0 C 46.4 13.7, 16.6 16.1, 0 0Z" fill="#f4f2e8" stroke="rgba(150,146,118,.35)" stroke-width=".8"/><path d="M2 0 L 59.6 0" fill="none" stroke="rgba(150,146,118,.4)" stroke-width=".8" stroke-linecap="round"/></g><g transform="translate(130.0 80.8) rotate(30.9)"><path d="M0 0 C 15.6 -15.2, 43.7 -12.9, 62.375 0 C 43.7 12.9, 15.6 15.2, 0 0Z" fill="#f4f2e8" stroke="rgba(150,146,118,.35)" stroke-width=".8"/><path d="M2 0 L 56.1 0" fill="none" stroke="rgba(150,146,118,.4)" stroke-width=".8" stroke-linecap="round"/></g><g transform="translate(160.0 80.8) rotate(-36.4)"><path d="M0 0 C 14.6 -14.2, 40.9 -12.1, 58.5 0 C 40.9 12.1, 14.6 14.2, 0 0Z" fill="#f4f2e8" stroke="rgba(150,146,118,.35)" stroke-width=".8"/><path d="M2 0 L 52.6 0" fill="none" stroke="rgba(150,146,118,.4)" stroke-width=".8" stroke-linecap="round"/></g><g transform="translate(190.0 80.4) rotate(34.4)"><path d="M0 0 C 13.7 -13.3, 38.2 -11.3, 54.625 0 C 38.2 11.3, 13.7 13.3, 0 0Z" fill="#f4f2e8" stroke="rgba(150,146,118,.35)" stroke-width=".8"/><path d="M2 0 L 49.2 0" fill="none" stroke="rgba(150,146,118,.4)" stroke-width=".8" stroke-linecap="round"/></g><g transform="translate(220.0 79.6) rotate(-30.7)"><path d="M0 0 C 12.7 -12.4, 35.5 -10.5, 50.75 0 C 35.5 10.5, 12.7 12.4, 0 0Z" fill="#f4f2e8" stroke="rgba(150,146,118,.35)" stroke-width=".8"/><path d="M2 0 L 45.7 0" fill="none" stroke="rgba(150,146,118,.4)" stroke-width=".8" stroke-linecap="round"/></g><g transform="translate(250.0 78.4) rotate(36.1)"><path d="M0 0 C 11.7 -11.4, 32.8 -9.7, 46.875 0 C 32.8 9.7, 11.7 11.4, 0 0Z" fill="#f4f2e8" stroke="rgba(150,146,118,.35)" stroke-width=".8"/><path d="M2 0 L 42.2 0" fill="none" stroke="rgba(150,146,118,.4)" stroke-width=".8" stroke-linecap="round"/></g><g transform="translate(280.0 76.7) rotate(-30.4)"><path d="M0 0 C 10.8 -10.5, 30.1 -8.9, 43.0 0 C 30.1 8.9, 10.8 10.5, 0 0Z" fill="#f4f2e8" stroke="rgba(150,146,118,.35)" stroke-width=".8"/><path d="M2 0 L 38.7 0" fill="none" stroke="rgba(150,146,118,.4)" stroke-width=".8" stroke-linecap="round"/></g><g transform="translate(310.0 74.7) rotate(35.2)"><path d="M0 0 C 9.8 -9.6, 27.4 -8.1, 39.125 0 C 27.4 8.1, 9.8 9.6, 0 0Z" fill="#f4f2e8" stroke="rgba(150,146,118,.35)" stroke-width=".8"/><path d="M2 0 L 35.2 0" fill="none" stroke="rgba(150,146,118,.4)" stroke-width=".8" stroke-linecap="round"/></g><g transform="translate(340.0 72.4) rotate(-30.8)"><path d="M0 0 C 8.8 -8.6, 24.7 -7.3, 35.25 0 C 24.7 7.3, 8.8 8.6, 0 0Z" fill="#f4f2e8" stroke="rgba(150,146,118,.35)" stroke-width=".8"/><path d="M2 0 L 31.7 0" fill="none" stroke="rgba(150,146,118,.4)" stroke-width=".8" stroke-linecap="round"/></g><g transform="translate(370.0 69.9) rotate(31.1)"><path d="M0 0 C 7.8 -7.7, 22.0 -6.5, 31.375 0 C 22.0 6.5, 7.8 7.7, 0 0Z" fill="#f4f2e8" stroke="rgba(150,146,118,.35)" stroke-width=".8"/><path d="M2 0 L 28.2 0" fill="none" stroke="rgba(150,146,118,.4)" stroke-width=".8" stroke-linecap="round"/></g><g transform="translate(410.0 66.0) rotate(-4.0)"><path d="M0 0 C 8.5 -8.0, 23.8 -6.8, 34 0 C 23.8 6.8, 8.5 8.0, 0 0Z" fill="#f4f2e8" stroke="rgba(150,146,118,.35)" stroke-width=".8"/><path d="M2 0 L 30.6 0" fill="none" stroke="rgba(150,146,118,.4)" stroke-width=".8" stroke-linecap="round"/></g><path d="M92 80.4 Q 106 86.4 111.5 108.2" fill="none" stroke="#f4f2e8" stroke-width="3.2" stroke-linecap="round"/><circle cx="105.5" cy="108.2" r="5.2" fill="#f6f4ea" stroke="rgba(150,146,118,.35)" stroke-width=".7"/><circle cx="106.5" cy="119.4" r="4.6" fill="#f6f4ea" stroke="rgba(150,146,118,.35)" stroke-width=".7"/><circle cx="107.5" cy="130.5" r="4.0" fill="#f6f4ea" stroke="rgba(150,146,118,.35)" stroke-width=".7"/><path d="M182 80.6 Q 196 74.6 201.5 52.7" fill="none" stroke="#f4f2e8" stroke-width="3.2" stroke-linecap="round"/><circle cx="195.5" cy="52.7" r="5.2" fill="#f6f4ea" stroke="rgba(150,146,118,.35)" stroke-width=".7"/><circle cx="203.6" cy="45.5" r="4.6" fill="#f6f4ea" stroke="rgba(150,146,118,.35)" stroke-width=".7"/><circle cx="211.6" cy="38.3" r="4.0" fill="#f6f4ea" stroke="rgba(150,146,118,.35)" stroke-width=".7"/><path d="M272 77.2 Q 286 83.2 291.5 105.0" fill="none" stroke="#f4f2e8" stroke-width="3.2" stroke-linecap="round"/><circle cx="285.5" cy="105.0" r="5.2" fill="#f6f4ea" stroke="rgba(150,146,118,.35)" stroke-width=".7"/><circle cx="286.5" cy="116.2" r="4.6" fill="#f6f4ea" stroke="rgba(150,146,118,.35)" stroke-width=".7"/><circle cx="287.5" cy="127.4" r="4.0" fill="#f6f4ea" stroke="rgba(150,146,118,.35)" stroke-width=".7"/></symbol>
    <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .55  0 0 0 0 .45  0 0 0 .055 0"/></filter>
  </defs></svg>


  <div class="env-bg" aria-hidden="true"><i class="bgp tl"></i><i class="bgp tr"></i><i class="bgp ml"></i><i class="bgp mr"></i><i class="bgp bl"></i><i class="bgp br"></i></div>

  <div class="env-obj">
    <div class="env-shadow" aria-hidden="true"></div>

    <!-- inside of the envelope -->
    <div class="env-back" aria-hidden="true"></div>

    <!-- the flap (closed) -->
    <div class="env-flap">
      <div class="flap-face front">
        <div class="flap-shape">
          <svg class="env-paper" aria-hidden="true"><rect width="100%" height="100%" filter="url(#paper)"/></svg>
          <svg class="eb eb-fl" aria-hidden="true"><use href="#eb-branch"/></svg>
          <svg class="eb eb-fr" aria-hidden="true"><use href="#eb-branch"/></svg>
          <div class="env-mono" id="env-mono" aria-hidden="true"></div>
        </div>
      </div>
    </div>


    <!-- front of the body: two side folds + bottom fold -->
    <svg class="env-sides" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 0 L50 54 L0 100Z" class="sd"/><path d="M100 0 L50 54 L100 100Z" class="sd"/>
    </svg>
    <svg class="env-bottom" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 100 L50 49 L100 100Z" class="bt"/>
    </svg>
    <svg class="env-paper env-paper-body" aria-hidden="true"><rect width="100%" height="100%" filter="url(#paper)"/></svg>
    <svg class="eb eb-bl" aria-hidden="true"><use href="#eb-branch"/></svg>
    <svg class="eb eb-br" aria-hidden="true"><use href="#eb-branch"/></svg>

    <button type="button" class="env-seal" aria-label="" data-i18n-aria="envelope.ariaSeal"><img src="assets/wax-seal.png" alt=""></button>
    <div class="env-cta" aria-hidden="true">
      <svg viewBox="0 0 330 96">
        <path id="cta-arc" d="M22 28 C 108 72, 222 72, 308 28" fill="none"/>
        <text><textPath href="#cta-arc" startOffset="50%" text-anchor="middle" data-i18n="envelope.cta"></textPath></text>
        <g class="hand-pos"><g class="hand">
          <path d="M17 14l1.8 3M24 11l-1 3.6M30 14l-3 2.6" stroke-linecap="round" fill="none"/>
          <path d="M15 22c0-1.5 1.2-2.6 2.6-2.6s2.6 1.1 2.6 2.6v8l2.4-.4c1.4-.2 2.6.8 2.6 2.2l5.6 .8c1.3.2 2.2 1.3 2.1 2.6l-.9 9c-.2 1.6-1.5 2.8-3.1 2.8H21.2c-1.1 0-2.2-.6-2.7-1.6l-5-9.5c-.6-1.2-.1-2.6 1.1-3.2s2.4-.1 3.1 1l1.6 2.7z" stroke="none"/>
        </g></g>
      </svg>
    </div>
  </div>
</div>

<div class="bg" aria-hidden="true">
  <i class="bgp tl"></i><i class="bgp tr"></i><i class="bgp ml"></i><i class="bgp mr"></i><i class="bgp bl"></i><i class="bgp br"></i>
</div>
<div class="drift" aria-hidden="true">
  <img src="assets/leaves-falling.png" alt="" class="d1"><img src="assets/leaves-falling.png" alt="" class="d2"><img src="assets/leaves-falling.png" alt="" class="d3">
</div>
<main class="page">
<div class="sec sec-a">

  <!-- 1. HERO CARD -->
  <section class="hero reveal">
    <div class="hero-card">
      <p class="hero-sub" data-i18n="hero.kicker"></p>
      <h1 class="hero-names" id="hero-names"></h1>
      <div class="hero-photo"><img id="main-photo" alt="" data-i18n-alt="hero.photoAlt"></div>
      <img class="floral" src="assets/rose-corner.png" alt="" aria-hidden="true">
      <img class="seal" src="assets/wax-seal.png" alt="" aria-hidden="true">
    </div>
  </section>

  <!-- 2. FAMILIES CARD (family lines are built by render.js) -->
  <section class="card families reveal">
    <div id="family-list"></div>
    <hr>
    <p class="announce" data-i18n-html="families.announcement"></p>
    <div class="script" data-i18n="couple.full.0"></div>
    <div class="plus">+</div>
    <div class="script" data-i18n="couple.full.1"></div>
  </section>

  <!-- 3. CEREMONY CARD -->
  <section class="card ceremony reveal">
    <p class="small-caps" data-i18n="ceremony.intro"></p>
    <h2 data-i18n="ceremony.city"></h2>
    <p class="date small-caps" data-i18n-html="wedding.dateLabel"></p>
  </section>

  <!-- 4. GALLERY — polaroids on a string (cards are built by script.js) -->
  <section class="gallery reveal" id="gallery" role="region" aria-roledescription="carousel" aria-label="" data-i18n-aria="gallery.aria" tabindex="0">
    <svg class="g-string" aria-hidden="true"><path fill="none" stroke-width="1.5" stroke-linecap="round"/></svg>
    <div class="g-bar">
      <button type="button" class="g-btn" data-dir="-1" aria-label="" data-i18n-aria="gallery.prev"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <span class="g-count" aria-hidden="true"><b>01</b> / 06</span>
      <button type="button" class="g-btn" data-dir="1" aria-label="" data-i18n-aria="gallery.next"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </div>
    <div class="g-sr" aria-live="polite"></div>
  </section>

  <!-- 5. COUNTDOWN -->
  <section class="countdown reveal">
    <img class="bouquet" src="assets/rose-bouquet.png" alt="" aria-hidden="true">
    <p class="cd-sub" data-i18n="countdown.kicker"></p>
    <h2 class="cd-title" data-i18n="countdown.title"></h2>
    <div class="cd-row" id="countdown">
      <div><b id="cd-d">00</b><span data-i18n="countdown.labels.days"></span></div>
      <div><b id="cd-h">00</b><span data-i18n="countdown.labels.hours"></span></div>
      <div><b id="cd-m">00</b><span data-i18n="countdown.labels.minutes"></span></div>
      <div><b id="cd-s">00</b><span data-i18n="countdown.labels.seconds"></span></div>
    </div>
  </section>

  <!-- 6. RECEPTION -->
  <section class="reception reveal">
    <p class="r-label" data-i18n="events.reception.intro"></p>
    <h3 data-i18n="events.reception.name"></h3>
    <p class="r-addr" data-i18n="events.reception.address"></p>
    <a class="pill" id="maps-link" target="_blank" rel="noopener" href="#" data-i18n="events.reception.maps.label"></a>
  </section>

  <!-- 7. TIMELINE (items are built by render.js from events.*) -->
  <section class="timeline reveal" id="timeline">
    <div class="tl-line"></div>
  </section>

  <!-- 8. DRESS CODE -->
  <section class="dress reveal">
    <h3 data-i18n="dressCode.title"></h3>
    <div class="swatches" id="swatches"></div>
    <p data-i18n-html="dressCode.message"></p>
  </section>

</div>
<div class="sec sec-b">
  <!-- 9. GUESTBOOK -->
  <section class="guestbook reveal" id="guestbook">
    <p class="gb-sub" data-i18n="guestbook.kicker"></p>
    <h2 class="gb-title" data-i18n="guestbook.title"></h2>
    <form class="gb-card" id="gb-form">
      <input type="text" name="nom" placeholder="" data-i18n-ph="guestbook.namePlaceholder" required>
      <p class="q" data-i18n="guestbook.question"></p>
      <div class="radios">
        <label><input type="radio" name="present" value="oui"><i></i><span data-i18n="guestbook.yes"></span></label>
        <label><input type="radio" name="present" value="non"><i></i><span data-i18n="guestbook.no"></span></label>
      </div>
      <textarea name="message" placeholder="" data-i18n-ph="guestbook.messagePlaceholder"></textarea>
      <button type="submit" data-i18n="guestbook.send"></button>
      <p class="gb-thanks" id="gb-thanks" data-i18n="guestbook.thanks" hidden></p>
    </form>
  </section>
  <p class="closing reveal" data-i18n="closing"></p>
  <p class="credit reveal" id="credit" data-i18n-html="credit.html"></p>

</div>
</main>
<audio id="bg-music" loop preload="auto"></audio>

<!-- language toggle (always visible) + music button (appears once the envelope is open) -->
<div class="ibg-lang" role="group" aria-label="" data-i18n-aria="ui.languageAria">
  <button type="button" data-lang="fr" aria-pressed="true">FR</button>
  <button type="button" data-lang="en" aria-pressed="false">EN</button>
</div>
<button type="button" class="ibg-music" id="music-btn" aria-pressed="false" aria-label="" data-i18n-aria="ui.musicPlay" hidden>
  <svg class="ic-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor" stroke="none"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
  <svg class="ic-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor" stroke="none"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>

<script src="data.js"></script>
<script src="render.js"></script>
<script src="i18n.js"></script>
<script src="script.js"></script>
<script src="music.js"></script>
<script src="autoscroll.js"></script>
<script src="envelope.js"></script>
</body>
</html>
